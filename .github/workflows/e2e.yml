name: E2E

# Runs the Playwright browser tests (e2e/) against a throwaway back end and publishes the HTML
# report to GitHub Pages, so the supervisor can open the latest result at a fixed link:
#   https://stemotion-capstone-fall-2026.github.io/STEMotion_FE/
# Pages must use "GitHub Actions" as its source (Settings > Pages).

on:
  push:
    branches: [main, feat/auth-roles-google-whitelist-mail]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (WF-01..WF-04)
    # Pinned: ubuntu-latest moved to Ubuntu 26, where Playwright 1.56 cannot install its system deps.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The back end comes from its own repository; E2eServer (test scope) runs it on an
      # embedded PostgreSQL with every paid AI/TTS/render call switched off.
      - uses: actions/checkout@v4
        with:
          repository: STEMotion-Capstone-FALL-2026/STEMotion_BE
          # Pre-merge auth changes span both repos; use the paired BE branch.
          # On main, continue verifying against BE main after coordinated rollout.
          ref: ${{ (github.head_ref || github.ref_name) == 'feat/auth-roles-google-whitelist-mail' && 'feat/auth-roles-google-whitelist-mail' || 'main' }}
          path: be

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: be/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e
        env:
          E2E_BE_DIR: be
          E2E_STEM: '1'

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Package the report for Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  publish:
    name: Publish report
    needs: e2e
    # Publish failures too: a red report is exactly what the team needs to see.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
